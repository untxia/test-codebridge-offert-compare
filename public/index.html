<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offer Compare</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0A0F1F">
  <link rel="preload" href="vendor/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="description" content="Compare deux versions d'une offre commerciale (PDF, Word, Excel, CSV...) et montre les changements de fond, avec leurs sources.">
  <link rel="stylesheet" href="vendor/tailwind.css">
</head>
<body>
  <canvas id="bg3d" aria-hidden="true"></canvas>
  <canvas id="logo3d" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- réfraction du verre : le décor derrière est légèrement déformé (Chromium ; ailleurs, simple flou) -->
  <filter id="glass-refract" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
  <header class="top">
    <div class="wrap top-in">
      <h1 class="brand"><img src="assets/logo.svg" alt="" width="36" height="36"><span id="t-title">Offer Compare</span></h1>
      <nav class="nav" aria-label="Navigation"><a href="#app-window" id="t-nav-cmp"></a><a href="#result" id="t-nav-res"></a><a href="#t-hero" id="t-nav-how"></a></nav>
      <div class="lang" role="group" aria-label="Language / Langue">
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <i class="top-bar" id="top-bar" aria-hidden="true"></i>
  </header>


  <section class="stage" id="stage" aria-label="Accueil">
    <div class="stage-in">
      <div class="sp-glow" aria-hidden="true"></div>
      <svg class="sp-ring r1" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="190" fill="none" stroke="url(#spring)" stroke-width="1.2" stroke-dasharray="2 9" stroke-linecap="round"/><defs><linearGradient id="spring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fb0ff"/><stop offset=".5" stop-color="#4adea8"/><stop offset="1" stop-color="#ff9ad5"/></linearGradient></defs></svg>
      <svg class="sp-ring r2" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="150" fill="none" stroke="#9fb0ff" stroke-opacity=".35" stroke-width="1"/><circle cx="200" cy="50" r="4" fill="#ffd23f"/></svg>
      <div class="sp-center">
        <svg class="sp-logo" viewBox="0 0 64 64" aria-hidden="true"><defs>
    <linearGradient id="spa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4adea8"/><stop offset="1" stop-color="#2a8fd8"/></linearGradient>
    <linearGradient id="spb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9b6ff"/><stop offset="1" stop-color="#5565f2"/></linearGradient>
    <linearGradient id="spc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff9a3f"/></linearGradient>
    <filter id="sps" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0a0e28" flood-opacity=".45"/></filter>
  </defs>
  <g class="sp-back"><g transform="rotate(-9 22 34)" filter="url(#sps)">
    <rect x="5" y="11" width="30" height="42" rx="6" fill="url(#spa)"/>
    <rect x="11" y="20" width="16" height="3" rx="1.5" fill="#fff" opacity=".6"/>
    <rect x="11" y="27" width="18" height="3" rx="1.5" fill="#fff" opacity=".6"/>
    <rect x="11" y="34" width="12" height="3" rx="1.5" fill="#fff" opacity=".6"/>
  </g>
  </g><g class="sp-front"><g transform="rotate(8 42 33)" filter="url(#sps)">
    <rect x="25" y="7" width="33" height="46" rx="6" fill="url(#spb)"/>
    <rect x="25.75" y="7.75" width="31.5" height="44.5" rx="5.3" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="32" y="17" width="19" height="3.5" rx="1.75" fill="#fff" opacity=".6"/>
    <rect x="31" y="26" width="21" height="8" rx="3" fill="url(#spc)"/>
    <rect x="32" y="41" width="13" height="3.5" rx="1.75" fill="#fff" opacity=".6"/>
  </g>
</g>
  <g class="sp-badge"><circle cx="49" cy="49" r="9" fill="#10142e"/>
  <path d="M49 42.8l5.6 9.4h-11.2z" fill="url(#spc)" stroke="url(#spc)" stroke-width="1.6" stroke-linejoin="round"/></g>

</svg>
        <div class="sp-name" id="sp-name" aria-hidden="true"></div>
        <p class="sp-tag" id="t-sp-tag"></p>
      </div>
      <a class="sp-cue" href="#t-hero" id="sp-cue"><span id="t-sp-cue"></span><i aria-hidden="true"></i></a>
    </div>
  </section>

  <section class="hero" aria-label="Offer Compare">
    <div class="wrap hero-copy">
      <p class="eyebrow"><span class="pulse" aria-hidden="true"></span><span id="t-eyebrow"></span></p>
      <h2 id="t-hero"></h2>
      <div class="hero-grid">
        <div>
          <p id="t-intro" class="intro"></p>
          <p class="cta-row"><a href="#app-window" class="cta" id="t-cta"></a><span class="cta-note" id="t-cta-note"></span></p>
        </div>
        <ol class="points" aria-label="Points clés">
          <li><b>01</b><div><h3 id="t-p1t"></h3><p id="t-p1d"></p></div></li>
          <li><b>02</b><div><h3 id="t-p2t"></h3><p id="t-p2d"></p></div></li>
          <li><b>03</b><div><h3 id="t-p3t"></h3><p id="t-p3d"></p></div></li>
        </ol>
      </div>
    </div>
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
  </section>

  <main class="wrap relative z-10">

    <section class="card window" id="app-window" aria-labelledby="t-inputs">
      <div class="titlebar" aria-hidden="true"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="tb-title">offer-compare</span></div>
      <h2 id="t-inputs"></h2>
      <div class="drops">
        <label class="drop" id="drop-original" for="file-original">
          <span class="drop-title" id="t-orig"></span>
          <span class="drop-file" id="name-original"></span>
          <input type="file" id="file-original" accept=".pdf,.docx,.xlsx,.ods,.odt,.csv,.tsv,.html,.htm,.json,.txt,.md">
        </label>
        <label class="drop" id="drop-revised" for="file-revised">
          <span class="drop-title" id="t-rev"></span>
          <span class="drop-file" id="name-revised"></span>
          <input type="file" id="file-revised" accept=".pdf,.docx,.xlsx,.ods,.odt,.csv,.tsv,.html,.htm,.json,.txt,.md">
        </label>
      </div>
      <div class="actions">
        <button type="button" id="btn-compare" class="primary"></button>
        <span class="samples"><span id="t-samples"></span>
          <button type="button" class="link" data-sample="normal"></button>
          <button type="button" class="link" data-sample="format"></button>
          <button type="button" class="link" data-sample="ambiguous"></button>
          <button type="button" class="link" data-sample="scanned"></button>
          <button type="button" class="link" data-sample="mixed"></button>
        </span>
      </div>
      <p id="t-limits" class="hint"></p>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="result"></div>
  </main>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <span class="traffic" aria-hidden="true"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></span>
      <h2 id="viewer-title"></h2>
      <button type="button" id="viewer-close" class="ghost"></button>
    </div>
    <div class="viewer-body">
      <figure><figcaption id="vc-orig"></figcaption><div class="page" id="page-original"></div></figure>
      <figure><figcaption id="vc-rev"></figcaption><div class="page" id="page-revised"></div></figure>
    </div>
  </dialog>

  <script src="vendor/pdf.min.js"></script>
  <script src="app.js"></script>
  <script type="module" src="vendor/hero.js"></script>
  <script type="module" src="vendor/scroll.js"></script>
  <script type="module" src="vendor/stage3d.js"></script>
</body>
</html>
